plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.fishvoicesetup.shell'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.fishvoicesetup.shell'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
